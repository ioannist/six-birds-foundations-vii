[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "six-birds-collatz-lab"
version = "0.0.0"
description = "Toy-laboratory substrate package for Six Birds Foundations VI"
requires-python = ">=3.11"
dependencies = [
  "python-sat>=1.9.dev5,<2",
  "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
plots = [
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
