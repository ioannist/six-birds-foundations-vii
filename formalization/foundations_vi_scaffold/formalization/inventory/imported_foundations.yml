# Foundations VI imported Foundations IV audit.
#
# Each entry compares `THEOREMS.md` prose about a cited F-row with the
# corresponding vendored Lean file. Discrepancies are recorded here; any
# resulting `THEOREMS.md` prose fix is a separate, explicit manager decision,
# recorded per-entry in that entry's `manager_resolution:` field rather than
# applied silently.

- object: "F2"
  cited_by: ["G2"]
  theorems_md_claim: >-
    F2 fixes one source quotient q:X->Q, one upstairs map F:X->Y, and one
    target readout r:Y->R; descent through q is equivalent to an empty
    split-pair obstruction, with source-refinement and target-coarsening
    repairs.
  lean_source: "lean/vendor/foundations/six-birds-meta-math/lean/SixBirdsMetaMath/FoundationsIV/Transport/DescentRepair.lean"
  identifiers:
    - "descent_repair_normal_form"
  lean_statement: >-
    Defines splitPairObstruction, Descends, SourceRefinement, TargetCoarsening,
    sourceRepairQuotient, target repair quotient, and proves
    descent_repair_normal_form: Descends q F r iff the split-pair obstruction
    is empty, assuming q is surjective; also proves source and target repair
    closure theorems.
  status: "verified_correct"
  audit_note: >-
    The prose matches the Lean row. The Lean theorem makes quotient
    surjectivity explicit, which is compatible with the prose's quotient-map
    framing.

- object: "F3"
  cited_by: ["G5", "G8"]
  theorems_md_claim: >-
    F3 compares two route outcomes at one fixed interface: they are invisible
    to current quotient probes but distinguished by predictive/future probes,
    so the output is a memory/predictive residue record rather than a global
    scalar or odometer.
  lean_source: "lean/vendor/foundations/six-birds-meta-math/lean/SixBirdsMetaMath/FoundationsIV/Transport/HolonomyMemoryRepair.lean"
  identifiers:
    - "holonomy_memory_repair_normal_form"
  lean_statement: >-
    Defines CurrentQInvisible, FutureMVisible, HiddenRouteResidue,
    MemoryWitness, and PredictiveRepairWitness. The theorem
    holonomy_memory_repair_normal_form proves that a route has a memory witness
    iff there exist two routes, one the given route, with a predictive repair
    witness through pi:M->Q.
  status: "verified_correct"
  audit_note: >-
    The prose's two-route/current-vs-predictive-memory framing matches the Lean
    normal form. The Lean statement is existential around a chosen route rather
    than a named pair comparison, but it is the same interface.

- object: "F4"
  cited_by: ["G4", "G11", "G13"]
  theorems_md_claim: >-
    F4 starts with a declared finite patch system or finite local-family setup,
    overlap compatibility, and a restriction map from global objects; it
    classifies compatible local data by whether they globalize, are ambiguous,
    exact, or incompatible.
  lean_source: "lean/vendor/foundations/six-birds-meta-math/lean/SixBirdsMetaMath/FoundationsIV/Transport/LocalGlobalObstruction.lean"
  identifiers:
    - "local_global_obstruction_normal_form"
  lean_statement: >-
    Defines arbitrary types Global and LocalFamily, a compatibility predicate,
    and a restriction map R:Global->LocalFamily. The theorem
    local_global_obstruction_normal_form proves compatible a globalizes iff it
    lies in the declared image of R, and that exactly one of four statuses
    holds: overlapInconsistent, compatibleNonGlobal, globalAmbiguous,
    globalExact.
  status: "discrepancy_found"
  audit_note: >-
    The status classification matches. The discrepancy is that `THEOREMS.md`
    repeatedly says F4's setup is a finite patch system, while the Lean theorem
    does not encode finiteness or a finite index set; it abstracts the local
    family as an arbitrary type. This may be a legitimate prose/docstring
    compression from the paper version, but it is stronger than the mechanized
    statement.
  manager_resolution: >-
    Confirmed by direct read of LocalGlobalObstruction.lean: no Fintype/Finite
    constraint anywhere in the definitions or in local_global_obstruction_normal_form.
    No action on THEOREMS.md. G4/G11/G13's novelty arguments against F4 are not
    load-bearing on finiteness -- the actual differentiating axis in all three
    (verified against THEOREMS.md lines 608, 1391, 1600) is single-fixed-object
    static classification (one `a`, one `R`) vs. stage-indexed/forall-p/asymptotic
    structure over a growing or unbounded family. That axis holds regardless of
    whether Global/LocalFamily are finite. The "finite patch system" language in
    THEOREMS.md describes F4's published paper Setup (independently verified
    against the .tex source earlier in this project), not the Lean formalization,
    so it remains accurate as a paper-vs-paper rebadge claim. Net: Lean is more
    general than the paper's stated scope; this is a legitimate formalizer choice,
    not an error in either the paper or THEOREMS.md.

