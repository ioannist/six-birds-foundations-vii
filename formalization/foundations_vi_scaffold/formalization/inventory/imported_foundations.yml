- object: "F49"
  cited_by: ["G13"]
  theorems_md_claim: >-
    F49 Common-Source / Nonlocal Correlation is described as testing a fixed
    common-source/interface/direct-route factorization of readouts, not an
    asymptotic orbit-density law.
  lean_source: "lean/vendor/foundations/six-birds-meta-math/lean/SixBirdsMetaMath/FoundationsIV/SelfReferenceLimits/CommonSourceNonlocal.lean"
  identifiers:
    - "common_source_nonlocal_correlation"
  lean_statement: >-
    Defines common-source, interface-mediated, and direct-route explanations,
    their split-pair obstructions, accepted explanations as source OR route OR
    interface, correlation residuals, and nonlocal residuals relative to a
    failed locality package. The theorem common_source_nonlocal_correlation
    proves the corresponding obstruction/factorization and residual
    equivalences.
  status: "verified_correct"
  audit_note: >-
    The original G13 aside omitted direct-route explanations and was recorded
    here as a discrepancy. That discrepancy was caught by this citation audit,
    and `THEOREMS.md` was fixed on 2026-07-06 to read
    "common-source/interface/direct-route factorization." The prose now matches
    the Lean row's three-way AcceptedCorrelationExplanation disjunction.
  manager_resolution: >-
    Historical resolution: confirmed by direct read of CommonSourceNonlocal.lean:
    AcceptedCorrelationExplanation is commonSource OR directRoute OR
    sharedInterface, a three-way disjunction. F49 is cited only once in
    THEOREMS.md (line 1600, G13's cousin aside) and is not load-bearing for any
    novelty argument -- it is a one-sentence dismissal establishing F49 as a
    weaker cousin than F4. `THEOREMS.md` was fixed to read
    "common-source/interface/direct-route factorization" so the aside lists all
    three accepted-explanation cases. The underlying differentiating claim
    (fixed single-readout classification vs. asymptotic orbit density over an
    unbounded family) is unaffected by the omitted third case either way.
