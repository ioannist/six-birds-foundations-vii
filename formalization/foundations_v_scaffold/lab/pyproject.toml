[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "six-birds-cognition-lab"
version = "0.0.0"
description = "Toy-laboratory substrate package for Six Birds Foundations V"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2,<3",
  "pydantic>=2.13,<3",
  "pyyaml>=6,<7",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

